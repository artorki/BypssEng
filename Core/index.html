<!-- BypssEng - artorki -->

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BypssEng Dashboard</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --border: #334155; --green: #22c55e; --red: #ef4444; --yellow: #eab308; --blue: #3b82f6; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: var(--card); padding: 15px; border-radius: 8px; border: 1px solid var(--border); }
        .card h3 { color: var(--muted); font-size: 14px; margin-bottom: 10px; text-transform: uppercase; }
        .value { font-size: 24px; font-weight: bold; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; text-transform: uppercase; display: inline-block; }
        .badge.ok { background: rgba(34,197,94,0.2); color: var(--green); }
        .badge.warn { background: rgba(234,179,8,0.2); color: var(--yellow); }
        .badge.fail { background: rgba(239,68,68,0.2); color: var(--red); }
        .severity-bar { width: 100%; height: 8px; background: var(--border); border-radius: 4px; margin-top: 10px; overflow: hidden; }
        .severity-fill { height: 100%; background: var(--green); transition: width 0.5s, background 0.5s; }
        #logs { max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 12px; line-height: 1.6; }
        .log-line { padding: 2px 5px; border-bottom: 1px solid var(--border); }
        .log-PASS { color: var(--green); } .log-WARN { color: var(--yellow); } .log-FAIL, .log-ERROR { color: var(--red); } .log-SOL { color: var(--blue); }
        .chart-container { height: 150px; display: flex; align-items: flex-end; gap: 2px; padding-top: 20px; }
        .bar { flex: 1; background: var(--blue); border-radius: 2px 2px 0 0; opacity: 0.7; transition: height 0.3s; }
        .bar:hover { opacity: 1; }
    </style>
</head>
<body>
    <div class="header">
        <h1>BypssEng Dashboard</h1>
        <div id="verdict-box" class="badge ok">Loading...</div>
    </div>

    <div class="grid">
        <div class="card">
            <h3>Severity Score</h3>
            <div class="value" id="severity-score">--</div>
            <div class="severity-bar"><div id="severity-fill" class="severity-fill" style="width: 0%"></div></div>
        </div>
        <div class="card">
            <h3>Applied Bypass</h3>
            <div class="value" id="bypass-method">None</div>
        </div>
        <div class="card">
            <h3>Network States</h3>
            <div id="states" style="display: flex; flex-wrap: wrap; gap: 5px;"></div>
        </div>
        <div class="card">
            <h3>Success History (Last 50)</h3>
            <div class="chart-container" id="history-chart"></div>
        </div>
    </div>

    <div class="card">
        <h3>Live Logs</h3>
        <div id="logs"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token') || 'invalid';
        
        const ws = new WebSocket(`ws://${window.location.host}/ws?token=${token}`);
        
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'log') addLog(data.payload);
            else if (data.type === 'network_update') updateStatus(data.payload);
        };

        async function fetchStatus() {
            try {
                const res = await fetch('/api/status', { headers: { 'Authorization': `Bearer ${token}` } });
                if(res.ok) {
                    const data = await res.json();
                    if(data.report) updateStatus(data.report);
                }
            } catch(e) {}
        }

        async function fetchHistory() {
            try {
                const res = await fetch('/api/history', { headers: { 'Authorization': `Bearer ${token}` } });
                if(res.ok) {
                    const data = await res.json();
                    renderChart(data.reverse());
                }
            } catch(e) {}
        }

        function updateStatus(report) {
            const verdict = report.verdict || {};
            const score = verdict.severity_score || 0;
            
            document.getElementById('severity-score').innerText = `${score}/100`;
            const fill = document.getElementById('severity-fill');
            fill.style.width = `${score}%`;
            fill.style.background = score > 70 ? 'var(--green)' : score > 40 ? 'var(--yellow)' : 'var(--red)';

            document.getElementById('bypass-method').innerText = report.applied_bypass || 'None';

            const verdictBox = document.getElementById('verdict-box');
            const conf = verdict.confidence || 'low';
            verdictBox.innerText = `${report.selected_method || 'Unknown'} (${conf})`;
            verdictBox.className = `badge ${conf === 'high' ? 'ok' : conf === 'medium' ? 'warn' : 'fail'}`;

            const statesDiv = document.getElementById('states');
            statesDiv.innerHTML = '';
            const states = report.states || {};
            for(const key in states) {
                const val = typeof states[key] === 'object' ? JSON.stringify(states[key]) : states[key];
                const isOk = val === 'ok' || val === true || val === 'none';
                statesDiv.innerHTML += `<div class="badge ${isOk ? 'ok' : 'fail'}">${key}: ${val}</div>`;
            }
        }

        function addLog(log) {
            const logsDiv = document.getElementById('logs');
            const time = new Date(log.ts * 1000).toLocaleTimeString();
            const line = document.createElement('div');
            line.className = `log-line log-${log.level}`;
            line.innerText = `[${time}] [${log.level}] ${log.msg}`;
            logsDiv.prepend(line);
            if(logsDiv.children.length > 100) logsDiv.removeChild(logsDiv.lastChild);
        }

        function renderChart(history) {
            const chart = document.getElementById('history-chart');
            chart.innerHTML = '';
            history.forEach(item => {
                const score = item.data?.verdict?.severity_score || 0;
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.height = `${score}%`;
                bar.style.background = score > 70 ? 'var(--green)' : score > 40 ? 'var(--yellow)' : 'var(--red)';
                bar.title = `Score: ${score}`;
                chart.appendChild(bar);
            });
        }

        fetchStatus();
        fetchHistory();
        setInterval(fetchStatus, 5000);
    </script>
</body>
</html>
