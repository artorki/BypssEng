<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد BypssEng</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --border: #334155; --green: #22c55e; --red: #ef4444; --yellow: #eab308; --blue: #3b82f6; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: var(--card); padding: 15px; border-radius: 8px; border: 1px solid var(--border); }
        .card h3 { color: var(--muted); font-size: 14px; margin-bottom: 10px; text-transform: uppercase; }
        .value { font-size: 24px; font-weight: bold; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; text-transform: uppercase; display: inline-block; margin: 2px; }
        .badge.ok { background: rgba(34,197,94,0.2); color: var(--green); }
        .badge.warn { background: rgba(234,179,8,0.2); color: var(--yellow); }
        .badge.fail { background: rgba(239,68,68,0.2); color: var(--red); }
        .severity-bar { width: 100%; height: 8px; background: var(--border); border-radius: 4px; margin-top: 10px; overflow: hidden; }
        .severity-fill { height: 100%; background: var(--green); transition: width 0.5s, background 0.5s; }
        #logs { max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 12px; line-height: 1.6; }
        .log-line { padding: 2px 5px; border-bottom: 1px solid var(--border); }
        .log-PASS { color: var(--green); } .log-WARN { color: var(--yellow); } .log-FAIL, .log-ERROR { color: var(--red); } .log-SOL { color: var(--blue); }
        .chart-container { height: 100px; display: flex; align-items: flex-end; gap: 2px; padding-top: 20px; }
        .bar { flex: 1; background: var(--blue); border-radius: 2px 2px 0 0; opacity: 0.7; transition: height 0.3s; }
        .bar:hover { opacity: 1; }
        input, button { width: 100%; padding: 8px; margin-bottom: 10px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 4px; }
        button { background: var(--blue); border: none; cursor: pointer; font-weight: bold; }
        button:hover { opacity: 0.8; }
        .input-group { display: flex; gap: 10px; }
        .input-group input { margin-bottom: 0; flex: 1; }
        .input-group button { width: auto; padding: 8px 15px; white-space: nowrap; }
        .status-text { font-size: 12px; color: var(--muted); margin-top: 5px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>داشبورد BypssEng</h1>
        <div id="verdict-box" class="badge warn">در حال بارگذاری...</div>
    </div>

    <div class="grid">
        <div class="card">
            <h3>امتیاز وضعیت شبکه</h3>
            <div class="value" id="severity-score">--</div>
            <div class="severity-bar"><div id="severity-fill" class="severity-fill" style="width: 0%"></div></div>
        </div>
        <div class="card">
            <h3>روش اتصال فعلی</h3>
            <div class="value" id="bypass-method">سیستم در حال بررسی است</div>
        </div>
        <div class="card">
            <h3>وضعیت لایه‌های شبکه</h3>
            <div id="states" style="display: flex; flex-wrap: wrap; gap: 5px;"></div>
        </div>
        <div class="card">
            <h3>تاریخچه اتصال (۵۰ مورد اخیر)</h3>
            <div class="chart-container" id="history-chart"></div>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <h3>افزودن لینک ساب‌اسکریپشن شخصی</h3>
            <div class="input-group">
                <input type="text" id="sub-url" placeholder="لینک ساب‌اسکریپشن خود را وارد کنید">
                <button onclick="saveSub()">ذخیره و دریافت</button>
            </div>
            <div id="sub-status" class="status-text"></div>
        </div>
        <div class="card">
            <h3>تست دستی کانفیگ</h3>
            <div class="input-group">
                <input type="text" id="config-link" placeholder="لینک کانفیگ (vless, trojan, ...)">
                <button onclick="testConfig()">تست پینگ</button>
            </div>
            <div id="test-result" class="status-text"></div>
        </div>
    </div>

    <div class="card">
        <h3>لاگ‌های زنده سیستم</h3>
        <div id="logs"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token') || 'invalid';
        
        const ws = new WebSocket(`ws://${window.location.host}/ws?token=${token}`);
        
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'log') addLog(data.payload);
            else if (data.type === 'network_update') updateStatus(data.payload);
        };

        async function fetchStatus() {
            try {
                const res = await fetch('/api/status', { headers: { 'Authorization': `Bearer ${token}` } });
                if(res.ok) {
                    const data = await res.json();
                    if(data.report) updateStatus(data.report);
                }
            } catch(e) {}
        }

        async function fetchHistory() {
            try {
                const res = await fetch('/api/history', { headers: { 'Authorization': `Bearer ${token}` } });
                if(res.ok) {
                    const data = await res.json();
                    renderChart(data.reverse());
                }
            } catch(e) {}
        }

        function updateStatus(report) {
            const verdict = report.verdict || {};
            const score = verdict.severity_score || 0;
            
            document.getElementById('severity-score').innerText = `${score}/100`;
            const fill = document.getElementById('severity-fill');
            fill.style.width = `${score}%`;
            fill.style.background = score > 70 ? 'var(--green)' : score > 40 ? 'var(--yellow)' : 'var(--red)';

            document.getElementById('bypass-method').innerText = report.applied_bypass || 'هیچ‌کدام';

            const verdictBox = document.getElementById('verdict-box');
            const conf = verdict.confidence || 'low';
            verdictBox.innerText = `${report.selected_method || 'نامشخص'} (${conf})`;
            verdictBox.className = `badge ${conf === 'high' ? 'ok' : conf === 'medium' ? 'warn' : 'fail'}`;

            const statesDiv = document.getElementById('states');
            statesDiv.innerHTML = '';
            const states = report.states || {};
            for(const key in states) {
                const val = typeof states[key] === 'object' ? JSON.stringify(states[key]) : states[key];
                const isOk = val === 'ok' || val === true || val === 'none';
                statesDiv.innerHTML += `<div class="badge ${isOk ? 'ok' : 'fail'}">${key}: ${val}</div>`;
            }
        }

        function addLog(log) {
            const logsDiv = document.getElementById('logs');
            const time = new Date(log.ts * 1000).toLocaleTimeString('fa-IR');
            const line = document.createElement('div');
            line.className = `log-line log-${log.level}`;
            line.innerText = `[${time}] [${log.level}] ${log.msg}`;
            logsDiv.prepend(line);
            if(logsDiv.children.length > 100) logsDiv.removeChild(logsDiv.lastChild);
        }

        function renderChart(history) {
            const chart = document.getElementById('history-chart');
            chart.innerHTML = '';
            history.forEach(item => {
                const score = item.data?.verdict?.severity_score || 0;
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.height = `${score}%`;
                bar.style.background = score > 70 ? 'var(--green)' : score > 40 ? 'var(--yellow)' : 'var(--red)';
                bar.title = `Score: ${score}`;
                chart.appendChild(bar);
            });
        }

        async function saveSub() {
            const url = document.getElementById('sub-url').value;
            if(!url) return;
            const statusDiv = document.getElementById('sub-status');
            statusDiv.innerText = "در حال ذخیره و دریافت کانفیگ‌ها...";
            statusDiv.style.color = "var(--yellow)";
            try {
                const res = await fetch('/api/configs/subscription', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({urls: [url]})
                });
                const data = await res.json();
                if(res.ok) {
                    statusDiv.innerText = "لینک ذخیره شد. کانفیگ‌ها در پس‌زمینه دریافت می‌شوند.";
                    statusDiv.style.color = "var(--green)";
                } else {
                    throw new Error(data.error);
                }
            } catch(e) {
                statusDiv.innerText = `خطا: ${e.message}`;
                statusDiv.style.color = "var(--red)";
            }
        }

        async function testConfig() {
            const link = document.getElementById('config-link').value;
            if(!link) return;
            const resultDiv = document.getElementById('test-result');
            resultDiv.innerText = "در حال تست اتصال به سرور...";
            resultDiv.style.color = "var(--yellow)";
            try {
                const res = await fetch('/api/configs/test', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({link: link})
                });
                const data = await res.json();
                if(res.ok) {
                    resultDiv.innerText = `پروتکل: ${data.parsed.protocol} | تاخیر: ${data.latency ? data.latency + ' ms' : 'ناموفق'}`;
                    resultDiv.style.color = data.latency ? "var(--green)" : "var(--red)";
                } else {
                    throw new Error(data.error);
                }
            } catch(e) {
                resultDiv.innerText = `خطا: ${e.message}`;
                resultDiv.style.color = "var(--red)";
            }
        }

        fetchStatus();
        fetchHistory();
        setInterval(fetchStatus, 5000);
    </script>
</body>
</html>
